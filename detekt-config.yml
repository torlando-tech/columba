build:
  maxIssues: 0
  excludeCorrectable: false
  weights:
    complexity: 2
    LongParameterList: 1
    style: 1
    comments: 1

config:
  validation: true
  warningsAsErrors: false

processors:
  active: true

console-reports:
  active: true

output-reports:
  active: true
  exclude:
    - 'TxtOutputReport'

comments:
  active: true
  CommentOverPrivateFunction:
    active: false
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false

complexity:
  active: true
  CyclomaticComplexMethod:
    active: true
    threshold: 18
    ignoreAnnotated: ['Composable']
  LargeClass:
    active: true
    threshold: 2000 # NativeReticulumProtocol: 93 override methods from ReticulumProtocol interface
    excludes: ['**/test/**', '**/androidTest/**']
  LongMethod:
    active: true
    threshold: 80
    ignoreAnnotated: ['Composable']
  LongParameterList:
    active: true
    functionThreshold: 8
    constructorThreshold: 10
    ignoreAnnotated: ['Composable']
  NestedBlockDepth:
    active: true
    threshold: 5
  TooManyFunctions:
    active: true
    thresholdInFiles: 15
    thresholdInClasses: 20
    thresholdInInterfaces: 25
    thresholdInObjects: 15
    thresholdInEnums: 15
    ignoreOverridden: true

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  SuspendFunWithFlowReturnType:
    active: true

naming:
  active: true
  FunctionNaming:
    active: true
    functionPattern: '[a-z][a-zA-Z0-9]*'
    ignoreAnnotated: ['Composable']
  VariableNaming:
    active: true
    variablePattern: '[a-z][A-Za-z0-9]*'
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Z][_A-Z0-9]*'

performance:
  active: true
  ForEachOnRange:
    active: true
  SpreadOperator:
    active: true

potential-bugs:
  active: true
  EqualsAlwaysReturnsTrueOrFalse:
    active: true
  EqualsWithHashCodeExist:
    active: true
  ExplicitGarbageCollectionCall:
    active: true
  UnreachableCode:
    active: true

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: true
    exceptionNames:
      - 'ArrayIndexOutOfBoundsException'
      - 'Error'
      - 'IllegalMonitorStateException'
      - 'IndexOutOfBoundsException'
      - 'NullPointerException'
      - 'RuntimeException'
      - 'Throwable'
    allowedExceptionNameRegex: '_|(ignore|expected).*'
  SwallowedException:
    active: true
    ignoredExceptionTypes:
      - 'InterruptedException'
      - 'MalformedURLException'
      - 'NumberFormatException'
      - 'ParseException'
    allowedExceptionNameRegex: '_|(ignore|expected).*'

columba:
  active: true
  BleLoggingTag:
    active: true
  DiscardedConcurrencyReturn:
    active: true
  NoHardcodedUiString:
    active: true
    excludes: ['**/test/**', '**/androidTest/**']
    # Ratified DO-NOT-TRANSLATE literals (exact source text, incl. quotes) per
    # the DNT policy in docs/translation-workflow.md. This config allowlist is
    # the sanctioned zero-tolerance
    # mechanism: the detekt baseline and the @Suppress count are both ratcheted
    # to zero, so DNT literals live HERE, not in code. Each entry cites its DNT
    # category. Adding an entry requires the same ratification as the checklist.
    doNotTranslateLiterals:
      # Telemetry (DNT checklist §1): Sentry jank breadcrumb, never rendered.
      - '"Janky frame: ${durationMs}ms"'
      # Animation API labels (DNT checklist §3): dev-only, never rendered.
      - '"flasher_step"'
      - '"wizard_step"'
      - '"tcp_wizard_step"'
      # Persisted/wire display-name fallbacks (policy 1): stored values must
      # not change with locale (IdentityRepository default identity,
      # FrequencyBand.UNKNOWN / RNodeBoard.UNKNOWN fallback labels).
      - '"Anonymous Peer"'
      - '"Unknown"'
      # Hardware product identifiers (proper nouns, same class as
      # TcpCommunityServer server names): users match these against the label
      # printed on the device; also used in logs and firmware lookups.
      - '"RAK4631"'
      - '"Heltec T114"'
      - '"Heltec LoRa32 v2"'
      - '"Heltec LoRa32 v3"'
      - '"Heltec LoRa32 v4"'
      - '"LilyGO T-Echo"'
      - '"LilyGO T-Beam"'
      - '"LilyGO T-Beam Supreme"'
      - '"LilyGO T-Deck"'
      - '"TTGO LoRa32 v2.0"'
      - '"TTGO LoRa32 v2.1"'
      - '"RNode (Original)"'
      - '"Homebrew ESP32"'
      # Exception diagnostic text (DNT checklist §2): RnsError.Generic message,
      # never rendered (render sites switch on the sealed type).
      - '"No delivery destination to apply display name to"'
      # Font-size preview glyph (MessagingScreen min/max slider labels): the
      # letter "A" rendered at two sizes, not translatable prose.
      - '"A"'
      # I2P destination display: a b32 address literal, not prose.
      - '"$b32Address.b32.i2p"'
  NoRelaxedMocks:
    active: true
  NoVerifyOnlyTests:
    active: true
  ReflectivelyKeptRequired:
    active: true
  StateFlowPollingLoop:
    active: true

style:
  active: true
  ForbiddenComment:
    active: false
  MagicNumber:
    active: false
  MaxLineLength:
    active: true
    maxLineLength: 200
  ReturnCount:
    active: true
    max: 3
  ThrowsCount:
    active: true
    max: 2
  UnusedPrivateMember:
    active: true
  UseCheckOrError:
    active: true
  UseRequire:
    active: true
  WildcardImport:
    active: true
    excludes: ['**/test/**', '**/androidTest/**']
