# 04-archive-unarchive.yaml
#
# Spec §6.3: overflow chip -> thread sheet; long-press a thread row ->
# Rename / Archive / Delete menu; archive moves the row to the Archived
# section, un-archive moves it back. All local-only (no wire traffic).
#
# Params: APP_ID, PEER_HASH, PEER_NAME, THREAD_TOKEN.
appId: ${APP_ID}
---
- runFlow:
    file: lib/open-self-chat.yaml
    env:
      APP_ID: ${APP_ID}
      PEER_HASH: ${PEER_HASH}
      PEER_NAME: ${PEER_NAME}

- extendedWaitUntil:
    visible: "Main"
    timeout: 10000

# Seed a thread with one message so it has a recognizable title.
- tapOn: "More threads"
- extendedWaitUntil:
    visible: "Threads"
    timeout: 10000
- tapOn: "+ New"
- tapOn: "Reply in thread…"
- inputText: ${THREAD_TOKEN}
- hideKeyboard
- tapOn: "Send message"
- extendedWaitUntil:
    visible: ${THREAD_TOKEN}
    timeout: 30000

# Overflow chip -> thread sheet.
- tapOn: "More threads"
- extendedWaitUntil:
    visible: "Threads"
    timeout: 10000

# Long-press the row -> management menu -> Archive.
- longPressOn:
    text: ".*${THREAD_TOKEN}.*"
- tapOn: "Archive"

# Row lands under Archived; the Active section no longer lists it.
- extendedWaitUntil:
    visible: "Archived"
    timeout: 10000
- assertVisible:
    text: ".*${THREAD_TOKEN}.*"
- takeScreenshot: threads-archived

# Long-press again -> Un-archive; the Archived section disappears.
- longPressOn:
    text: ".*${THREAD_TOKEN}.*"
- tapOn: "Un-archive"
- extendedWaitUntil:
    notVisible: "Archived"
    timeout: 10000
- takeScreenshot: threads-unarchived
