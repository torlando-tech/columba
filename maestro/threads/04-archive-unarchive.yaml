# 04-archive-unarchive.yaml
#
# Spec §5.3: the sheet row's trailing `⋮` (Rename / Mark read / Archive /
# Delete) archives the thread; the row moves into the pinned `Archived · N`
# footer section, which expands in place. Un-archive comes from the same menu
# in the Archived section. All local-only (no wire traffic).
#
# Params: APP_ID, PEER_HASH, PEER_NAME, THREAD_TOKEN.
appId: ${APP_ID}
---
- runFlow:
    file: lib/open-self-chat.yaml
    env:
      APP_ID: ${APP_ID}
      PEER_HASH: ${PEER_HASH}
      PEER_NAME: ${PEER_NAME}

# Seed a thread with one message so it has a recognizable title.
- runFlow:
    file: lib/open-threads-sheet.yaml
    env:
      APP_ID: ${APP_ID}
- tapOn: "+ New"
- tapOn: "Reply in thread…"
- inputText: ${THREAD_TOKEN}
- hideKeyboard
- tapOn: "Send message"
- extendedWaitUntil:
    visible: ${THREAD_TOKEN}
    timeout: 30000

# Open the sheet again; archive through the row menu.
- runFlow:
    file: lib/open-threads-sheet.yaml
    env:
      APP_ID: ${APP_ID}
- tapOn: "Thread actions"
- tapOn: "Archive"

# The row lands under the pinned Archived footer; dismiss the snackbar's
# Undo window by waiting, then expand the section.
- extendedWaitUntil:
    visible: "Archived"
    timeout: 10000
- tapOn: "Archived"
- assertVisible:
    text: ".*${THREAD_TOKEN}.*"
- takeScreenshot: threads-archived

# Un-archive from the Archived section's row menu; the footer disappears.
- tapOn: "Thread actions"
- tapOn: "Un-archive"
- extendedWaitUntil:
    notVisible: "Archived"
    timeout: 10000
- takeScreenshot: threads-unarchived
